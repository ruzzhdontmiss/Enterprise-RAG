services:
  # 1. FastAPI backend web service
  - type: web
    name: enterprise-rag-backend
    runtime: python
    plan: free
    buildCommand: "cd backend && pip install --upgrade pip && pip install -e ."
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: enterprise-rag-db-v2
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: "HS256"
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: MISTRAL_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: ENABLE_RERANKER
        value: "false"
      - key: ALLOWED_ORIGINS
        value: '["https://enterprise-rag-frontend-8miq.onrender.com"]'

  # 2. Next.js frontend web service
  - type: web
    name: enterprise-rag-frontend
    runtime: node
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npx next start -p $PORT"
    envVars:
      # Hardcoded instead of using fromService because Render's blueprint resolution
      # failed to output the full public URL, returning the bare internal hostname.
      - key: NEXT_PUBLIC_API_URL
        value: "https://enterprise-rag-backend-fiob.onrender.com"

databases:
  # Managed PostgreSQL DB
  - name: enterprise-rag-db-v2
    plan: free
